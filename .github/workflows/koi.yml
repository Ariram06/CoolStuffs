
name: Update Git Koi

on:
  schedule:
    # Runs automatically every night at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows you to manually trigger the workflow to test it

jobs:
  update-koi:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Git Koi
        uses: yalongwastaken/git-profile-koi@v1
        # The Action runs automatically using its built-in token
        
      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff-index --quiet HEAD || git commit -m "Update git-koi"
          git push
